name: MBUFlow checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r skills/mbu-flow/scripts/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q skills/mbu-flow/scripts tests
      - run: python skills/mbu-flow/scripts/mbu.py validate --root examples/independent-units
      - run: python skills/mbu-flow/scripts/mbu.py tickets --root examples/independent-units
